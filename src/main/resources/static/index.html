<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buscador de Peças</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px system-ui, sans-serif; margin: 0; padding: 24px;
         max-width: 900px; margin-inline: auto; }
  h1 { font-size: 20px; }
  form { display: flex; gap: 8px; margin-bottom: 24px; }
  input { flex: 1; padding: 10px; font-size: 16px; }
  button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
  .card { border: 1px solid #8884; border-radius: 8px; padding: 14px;
          margin-bottom: 12px; }
  .title { font-weight: 600; margin-bottom: 6px; }
  .cost { font-size: 20px; font-weight: 700; }
  .ref { text-decoration: line-through; opacity: .6; margin-left: 8px;
         font-size: 14px; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 8px;
         border-radius: 999px; border: 1px solid #8886; margin-right: 6px; }
  .warn { border-color: #c0392b; color: #c0392b; }
  .drop { color: #148f4b; font-weight: 600; }
  .failed { border: 1px solid #c0392b; padding: 10px; border-radius: 8px;
            margin-bottom: 16px; }
</style>
</head>
<body>
<h1>Buscador de Peças</h1>
<form id="f">
  <input id="term" placeholder="ex: memoria ddr4 8gb" autofocus>
  <button>Buscar</button>
</form>
<div id="out"></div>
<script>
const brl = v => Number(v).toLocaleString('pt-BR',
    { style: 'currency', currency: 'BRL' });

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const term = document.getElementById('term').value;
  const out = document.getElementById('out');
  out.textContent = 'Buscando...';
  const res = await fetch('/api/search?term=' + encodeURIComponent(term));
  if (!res.ok) { out.textContent = 'Erro na busca.'; return; }
  const data = await res.json();
  out.innerHTML = '';

  if (data.failedSources.length) {
    const d = document.createElement('div');
    d.className = 'failed';
    d.textContent = 'Fontes que falharam: ' + data.failedSources.join(', ')
                  + '. O resultado abaixo está incompleto.';
    out.appendChild(d);
  }
  if (!data.offers.length) {
    // A cobertura é parcial: dizer isso, em vez de deixar "nenhum resultado"
    // parecer "a loja não vende esse produto".
    out.insertAdjacentHTML('beforeend',
      '<p>Nenhuma oferta encontrada para <strong>'
      + term.replace(/</g, '&lt;') + '</strong>.</p>'
      + '<p>A busca cobre apenas estas categorias: <br>'
      + data.coveredCategories.join('<br>')
      + '</p><p>Se a peça estiver fora delas, ela não é consultada — '
      + 'o que é diferente de a loja não vender.</p>');
    return;
  }
  for (const o of data.offers) {
    // Título, vendedor, garantia e URL vêm da KaBuM — em item de marketplace,
    // o nome do vendedor é texto livre cadastrado por terceiros. Por isso o
    // card é montado com createElement/textContent, nunca com innerHTML: não
    // dá para esquecer de escapar um campo que nunca é interpretado como
    // marcação.
    const card = document.createElement('div');
    card.className = 'card';

    const titleDiv = document.createElement('div');
    titleDiv.className = 'title';
    const anchor = document.createElement('a');
    anchor.href = o.url;
    anchor.target = '_blank';
    anchor.rel = 'noopener';
    anchor.textContent = o.title;
    titleDiv.appendChild(anchor);
    card.appendChild(titleDiv);

    const priceDiv = document.createElement('div');
    const costSpan = document.createElement('span');
    costSpan.className = 'cost';
    costSpan.textContent = brl(o.effectiveCost);
    priceDiv.appendChild(costSpan);
    if (o.discountPercentage > 0) {
      const refSpan = document.createElement('span');
      refSpan.className = 'ref';
      refSpan.textContent = brl(o.referencePrice);
      priceDiv.appendChild(refSpan);
    }
    card.appendChild(priceDiv);

    if (o.changeSinceFirstSeen !== null) {
      const changeDiv = document.createElement('div');
      if (o.changeSinceFirstSeen < 0) changeDiv.className = 'drop';
      changeDiv.textContent =
          `${o.changeSinceFirstSeen}% em relação ao primeiro preço visto`;
      card.appendChild(changeDiv);
    }

    const tagsDiv = document.createElement('div');
    tagsDiv.style.marginTop = '8px';

    const sourceTag = document.createElement('span');
    sourceTag.className = 'tag';
    sourceTag.textContent = o.source;
    tagsDiv.appendChild(sourceTag);

    const sellerTag = document.createElement('span');
    sellerTag.className = 'tag';
    sellerTag.textContent = o.seller;
    tagsDiv.appendChild(sellerTag);

    if (o.thirdPartySeller) {
      const thirdTag = document.createElement('span');
      thirdTag.className = 'tag warn';
      thirdTag.textContent = 'Vendedor terceiro';
      tagsDiv.appendChild(thirdTag);
    }

    const warrantyTag = document.createElement('span');
    if (o.warranty === 'Sem Garantia') {
      warrantyTag.className = 'tag warn';
      warrantyTag.textContent = 'Sem garantia';
    } else {
      warrantyTag.className = 'tag';
      warrantyTag.textContent = o.warranty.slice(0, 40);
    }
    tagsDiv.appendChild(warrantyTag);

    if (!o.available) {
      const unavailTag = document.createElement('span');
      unavailTag.className = 'tag warn';
      unavailTag.textContent = 'Indisponível';
      tagsDiv.appendChild(unavailTag);
    }

    card.appendChild(tagsDiv);
    out.appendChild(card);
  }
});
</script>
</body>
</html>
