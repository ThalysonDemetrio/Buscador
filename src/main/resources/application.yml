spring:
  application:
    name: buscador
  http:
    clients:
      connect-timeout: 10s
      read-timeout: 30s
  datasource:
    url: jdbc:sqlite:buscador.db
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always

buscador:
  kabum:
    base-url: https://www.kabum.com.br
    user-agent: buscador-interno/1.0
    cache-ttl: PT6H
    categories:
      /hardware/memoria-ram: 20.0
      /hardware/placa-de-video-vga: 300.0
      /hardware/processadores: 100.0
      /hardware/placas-mae: 100.0
      /hardware/ssd-2-5: 40.0
      /hardware/disco-rigido-hd: 50.0
      /hardware/fontes: 80.0
      /hardware/coolers: 20.0
