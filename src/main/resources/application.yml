spring:
  application:
    name: buscador
  http:
    clients:
      connect-timeout: 10s
      read-timeout: 30s
  datasource:
    url: jdbc:sqlite:buscador.db
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always

buscador:
  kabum:
    base-url: https://www.kabum.com.br
    user-agent: buscador-interno/1.0
    cache-ttl: PT6H
    categories:
      - /hardware/memoria-ram
      - /hardware/placa-de-video
      - /hardware/processadores
      - /hardware/ssd-2-5
      - /hardware/placas-mae
